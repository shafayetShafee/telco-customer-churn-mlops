# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/catalog-data/introduction/#data-catalog

telco:
  type: pandas.CSVDataset
  filepath: data/01_raw/telco.csv
  metadata:
    kedro-viz:
      layer: raw

processed_target_col:
  type: pickle.PickleDataset
  filepath: data/03_primary/processed_target_col.pkl
  metadata:
    kedro-viz:
      layer: primary

processed_features_data:
  type: pandas.ParquetDataset
  filepath: data/03_primary/processed_features_data.parquet
  metadata:
    kedro-viz:
      layer: primary

X_train:
  type: kedro.io.MemoryDataset
  # filepath: data/05_model_input/X_train.parquet
  metadata:
    kedro-viz:
      layer: model_input

X_calib:
  # type: pandas.ParquetDataset
  type: kedro.io.MemoryDataset
  # filepath: data/05_model_input/X_calib.parquet
  metadata:
    kedro-viz:
      layer: model_input

X_test:
  # type: pandas.ParquetDataset
  type: kedro.io.MemoryDataset
  # filepath: data/05_model_input/X_test.parquet
  metadata:
    kedro-viz:
      layer: model_input

y_train:
  # type: pickle.PickleDataset
  type: kedro.io.MemoryDataset
  # filepath: data/05_model_input/y_train.pkl
  metadata:
    kedro-viz:
      layer: model_input

y_calib:
  # type: pickle.PickleDataset
  type: kedro.io.MemoryDataset
  # filepath: data/05_model_input/y_calib.pkl
  metadata:
    kedro-viz:
      layer: model_input

y_test:
  # type: pickle.PickleDataset
  type: kedro.io.MemoryDataset
  # filepath: data/05_model_input/y_test.pkl
  metadata:
    kedro-viz:
      layer: model_input

optuna_best_params:
  type: pickle.PickleDataset
  filepath: data/06_models/optuna_best_params.pkl
  metadata:
    kedro-viz:
      layer: models

optuna_search:
  type: pickle.PickleDataset
  filepath: data/06_models/optuna_search.pkl
  metadata:
    kedro-viz:
      layer: models

optuna_best_model:
  type: pickle.PickleDataset
  filepath: data/06_models/optuna_best_model.pkl
  metadata:
    kedro-viz:
      layer: models

calibrated_model:
  type: pickle.PickleDataset
  filepath: data/06_models/calibrated_model.pkl
  metadata:
    kedro-viz:
      layer: models

tuning_threshold_df:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pandas.CSVDataset
    filepath: data/06_models/tuning_threshold_df.csv
  metadata:
    kedro-viz:
      layer: models

best_threshold:
  type: kedro_mlflow.io.metrics.MlflowMetricDataset
  metadata:
    kedro-viz:
      layer: models

threshold_metrics_plot:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: matplotlib.MatplotlibDataset
    filepath: data/08_reporting/threshold_metrics_plot.png
    save_args:
      format: png
      dpi: 300
      bbox_inches: tight
  metadata:
    kedro-viz:
      layer: model_evaluation

calibration_reliability_plot:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: matplotlib.MatplotlibDataset
    filepath: data/08_reporting/calibration_reliability_plot.png
    save_args:
      format: png
      dpi: 300
      bbox_inches: tight
  metadata:
    kedro-viz:
      layer: model_evaluation

classification_report_df:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset: 
    type: pandas.CSVDataset
    filepath: data/08_reporting/classification_report_df.csv
  metadata:
    kedro-viz:
      layer: model_evaluation

calibrated_final_xgb_model:
  type: pickle.PickleDataset
  filepath: data/06_models/calibrated_final_xgb_model.pkl
  metadata:
    kedro-viz:
      layer: final_model