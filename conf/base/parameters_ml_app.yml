split_options:
  test_size: 0.15
  calib_size: 0.15
  random_state: ${globals:random_state}
  
optuna_options:
  cv: 2
  n_trials: 2
  random_state: ${globals:random_state}

prefit_calib_options:
  cv: "prefit"
  inductive: False
  random_state: ${globals:random_state}

shap_options: 
  explainer_name: "shap_explainer"
  bg_data_size: 1000
  eval_data_size: null
  plots_max_display: 25
  random_state: ${globals:random_state}

mlflow_evaluate_options:
  target: "${globals:target}"
  eval_metric: "${globals:eval_metric}"
  eval_metric_threshold: 0.8
  min_absolute_change: 0.05
  min_relative_change: 0.05

inference_options:
  prediction_col: "${globals:target}_prediction"
  proba_col: "${globals:target}_probability"
