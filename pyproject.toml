[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "telco_customer_churn_mlops"
readme = "README.md"
dynamic = [
    "version",
]
dependencies = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "kedro~=1.1.0",
    "kedro-datasets[pandas-csvdataset, pandas-parquetdataset]",
    "kedro-viz~=12.3.0",
    "scikit-learn~=1.7.0",
    "optuna~=4.8.0",
    "xgboost~=3.2.0",
    "matplotlib~=3.10.0",
    "mapie~=1.3.0",
    "optuna-integration[sklearn]~=4.8.0",
    "kedro-mlflow~=2.0.2",
    "shap==0.49.1",
    "pydantic==2.12.5"
]

[project.scripts]
telco-customer-churn-mlops = "telco_customer_churn_mlops.__main__:main"

[project.entry-points."kedro.hooks"]

[project.optional-dependencies]
dev = [
    "pytest-cov>=3,<7",
    "pytest-mock>=1.7.1, <2.0",
    "pytest~=7.2",
    "ruff~=0.15.0",
    "pip~=26.0.1",
    "wheel~=0.46.3"
]

[tool.setuptools.dynamic.version]
attr = "telco_customer_churn_mlops.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "telco_customer_churn_mlops"
project_name = "telco-customer-churn-mlops"
kedro_init_version = "1.2.0"
tools = "['Linting', 'Testing', 'Custom Logging', 'Data Structure']"
example_pipeline = "False"
source_dir = "src"

[tool.pytest.ini_options]
addopts = "--cov-report term-missing --cov src/telco_customer_churn_mlops -ra"

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",
    "W",
    "E",
    "I",
    "UP",
    "PL",
    "T201",
]
ignore = [
    "E501",
]
